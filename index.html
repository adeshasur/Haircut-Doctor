<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haircut Doctor - AI Recommender</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #f0f0f0;
            font-family: sans-serif;
        }

        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        /* Camera Styling */
        video {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 240px;
            border-radius: 12px;
            z-index: 10;
            transform: scaleX(-1);
            /* Mirror effect */
            border: 4px solid #333;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        /* Status Text Styling */
        #status {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2rem;
            color: #444;
            z-index: 5;
            pointer-events: none;
            text-align: center;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div id="container">
        <video id="input_video"></video>
        <div id="status">Waiting for code...</div>
    </div>
    <script>
        const videoElement = document.getElementById('input_video');
        const statusText = document.getElementById('status');

        // --- PHYSICS SETUP ---
        const Engine = Matter.Engine,
            Render = Matter.Render,
            Runner = Matter.Runner,
            Bodies = Matter.Bodies,
            Composite = Matter.Composite,
            Mouse = Matter.Mouse,
            MouseConstraint = Matter.MouseConstraint;

        const engine = Engine.create();
        const world = engine.world;

        // Create the canvas for physics
        const render = Render.create({
            element: document.body,
            engine: engine,
            options: {
                width: window.innerWidth,
                height: window.innerHeight,
                wireframes: false,
                background: 'transparent' // See-through background
            }
        });

        // Add Floor and Walls
        const wallOpts = { isStatic: true, render: { fillStyle: '#2c3e50' } };
        Composite.add(world, [
            Bodies.rectangle(window.innerWidth / 2, window.innerHeight + 50, window.innerWidth, 100, wallOpts), // Floor
            Bodies.rectangle(-50, window.innerHeight / 2, 100, window.innerHeight, wallOpts), // Left
            Bodies.rectangle(window.innerWidth + 50, window.innerHeight / 2, 100, window.innerHeight, wallOpts) // Right
        ]);

        Render.run(render);
        const runner = Runner.create();
        Runner.run(runner, engine);

        // AI Logic
        function onResults(results) {
            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                const landmarks = results.multiFaceLandmarks[0];

                // Math: Calculate Face Ratio (Length / Width)
                const faceWidth = Math.abs(landmarks[234].x - landmarks[454].x);
                const faceHeight = Math.abs(landmarks[10].y - landmarks[152].y);
                const ratio = faceHeight / faceWidth;

                let shape = "Round";
                if (ratio > 1.5) shape = "Oblong";
                else if (ratio > 1.35) shape = "Oval";
                else if (ratio < 1.15) shape = "Square";

                statusText.innerText = `Face Detected: ${shape}`;
                dropRecommendations(shape);
            }
        }

        // Load the FaceMesh Model
        const faceMesh = new FaceMesh({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}` });
        faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5 });
        faceMesh.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => { await faceMesh.send({ image: videoElement }); },
            width: 480, height: 360
        });
        camera.start();

        function dropRecommendations(faceShape) {
            // Simple Logic to drop boxes only once
            if (window.dropped) return;
            window.dropped = true;

            const colors = ["#e74c3c", "#3498db", "#f1c40f", "#2ecc71", "#9b59b6"];

            for (let i = 0; i < 5; i++) {
                let box = Bodies.rectangle(
                    Math.random() * window.innerWidth, // Random X position
                    -200 - (i * 100), // Start above screen
                    200, 60,
                    {
                        restitution: 0.9, // Bounciness
                        render: { fillStyle: colors[i] }
                    }
                );
                Composite.add(world, box);
            }

            // Add Mouse Control
            const mouse = Mouse.create(render.canvas);
            const mouseConstraint = MouseConstraint.create(engine, {
                mouse: mouse,
                constraint: { stiffness: 0.2, render: { visible: false } }
            });
            Composite.add(world, mouseConstraint);
            render.mouse = mouse;
        }
    </script>
</body>

</html>
