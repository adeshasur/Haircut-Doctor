<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haircut Doctor - AI Recommender</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #f0f0f0;
            font-family: sans-serif;
        }

        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        /* Camera Styling */
        video {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 240px;
            border-radius: 12px;
            z-index: 10;
            transform: scaleX(-1);
            /* Mirror effect */
            border: 4px solid #333;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        /* Status Text Styling */
        #status {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2rem;
            color: #444;
            z-index: 5;
            pointer-events: none;
            text-align: center;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div id="container">
        <video id="input_video"></video>
        <div id="status">Waiting for code...</div>
    </div>
    <script>
        const videoElement = document.getElementById('input_video');
        const statusText = document.getElementById('status');

        // AI Logic
        function onResults(results) {
            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                const landmarks = results.multiFaceLandmarks[0];

                // Math: Calculate Face Ratio (Length / Width)
                const faceWidth = Math.abs(landmarks[234].x - landmarks[454].x);
                const faceHeight = Math.abs(landmarks[10].y - landmarks[152].y);
                const ratio = faceHeight / faceWidth;

                let shape = "Round";
                if (ratio > 1.5) shape = "Oblong";
                else if (ratio > 1.35) shape = "Oval";
                else if (ratio < 1.15) shape = "Square";

                statusText.innerText = `Face Detected: ${shape}`;
            }
        }

        // Load the FaceMesh Model
        const faceMesh = new FaceMesh({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}` });
        faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5 });
        faceMesh.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => { await faceMesh.send({ image: videoElement }); },
            width: 480, height: 360
        });
        camera.start();
    </script>
</body>

</html>
